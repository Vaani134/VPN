

{% extends "base.html" %}

{% block title %}Session Logs - VPN Client Simulator{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <i class="bi bi-journal-text"></i> VPN Session Logs
                </h5>
            </div>
            <div class="card-body">
                <!-- Log Controls -->
                <div class="mb-3">
                    <button class="btn btn-primary" id="refreshLogs">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                    <button class="btn btn-secondary" id="clearDisplay">
                        <i class="bi bi-eraser"></i> Clear Display
                    </button>
                </div>
                
                <!-- Logs Display -->
                <div class="logs-container">
                    <pre id="logsDisplay" class="logs-content">Loading logs...</pre>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
class LogsViewer {
    constructor() {
        this.init();
    }
    
    init() {
        this.setupEventListeners();
        this.loadLogs();
        
        // Auto-refresh logs every 5 seconds
        setInterval(() => this.loadLogs(), 5000);
    }
    
    setupEventListeners() {
        document.getElementById('refreshLogs').addEventListener('click', () => this.loadLogs());
        document.getElementById('clearDisplay').addEventListener('click', () => this.clearDisplay());
    }
    
    async loadLogs() {
        try {
            const response = await fetch('/api/logs');
            const result = await response.json();
            
            if (result.logs && result.logs.length > 0) {
                const logsDisplay = document.getElementById('logsDisplay');
                logsDisplay.textContent = result.logs.join('');
                
                // Scroll to bottom
                logsDisplay.scrollTop = logsDisplay.scrollHeight;
            } else {
                document.getElementById('logsDisplay').textContent = 'No logs available';
            }
        } catch (error) {
            document.getElementById('logsDisplay').textContent = 'Error loading logs: ' + error.message;
        }
    }
    
    clearDisplay() {
        document.getElementById('logsDisplay').textContent = '';
    }
}

// Initialize logs viewer when page loads
document.addEventListener('DOMContentLoaded', () => {
    new LogsViewer();
});
</script>
{% endblock %}
"""
